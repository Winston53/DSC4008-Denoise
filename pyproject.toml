[project]
name = "dsc4008-denoising"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fiftyone>=1.22.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.66.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
